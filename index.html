<html><head><base href="https://websim.dev-next.co"><style>
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}
.entry {
  background: #222;
  padding: 10px;
  margin: 5px 0;
  border-radius: 5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.entry-actions button {
  margin-left: 5px;
  padding: 5px 10px;
  border-radius: 3px;
  border: none;
  cursor: pointer;
}
.edit-button {
  background: #2196F3;
  color: white;
}
.delete-button {
  background: #f44336;
  color: white;
}
input, button {
  padding: 8px;
  margin: 5px;
  border-radius: 4px;
  border: 1px solid #333;
}
button {
  background: #4CAF50;
  color: white;
  border: none;
  cursor: pointer;
}
button:hover {
  opacity: 0.9;
}
.editor {
  margin: 20px 0;
  padding: 15px;
  background: #222;
  border-radius: 5px;
}
</style></head><body>

<div id="storeViewer" style="padding: 20px; max-width: 800px; margin: 0 auto;">
  <h2>Multiplayer Store Editor</h2>
  <div id="users" style="margin-bottom: 20px;"></div>
  
  <div class="editor">
    <h3>Add New Value</h3>
    <input type="text" id="keyInput" placeholder="Key" style="margin-right: 10px;">
    <input type="text" id="valueInput" placeholder="Value">
    <button onclick="updateStore()">Add</button>
  </div>

  <div>
    <h3>Store Contents:</h3>
    <div id="storeContent"></div>
  </div>
</div>

<script>
const room = new WebsimSocket();

// Update the users display
room.onPeersChanged = (peers) => {
  const usersDiv = document.getElementById('users');
  usersDiv.innerHTML = '<h3>Connected Users:</h3>';
  Object.entries(peers).forEach(([clientId, {username, avatarUrl}]) => {
    usersDiv.innerHTML += `
      <div style="display: inline-block; margin: 5px; text-align: center;">
        <img src="${avatarUrl}" width="40" height="40" style="border-radius: 50%;">
        <div>${username}</div>
      </div>
    `;
  });
};

// Function to render the store content
async function renderStore() {
  const store = await room.store.getAll();
  const storeContent = document.getElementById('storeContent');
  storeContent.innerHTML = '';
  
  Object.entries(store).forEach(([key, value]) => {
    const entry = document.createElement('div');
    entry.className = 'entry';
    
    // Escape the key and value for safe insertion into HTML string
    const escapedKey = key.replace(/"/g, '&quot;');
    const escapedValue = JSON.stringify(value).replace(/"/g, '&quot;');
    
    entry.innerHTML = `
      <div class="entry-content">
        <strong>${escapedKey}:</strong> ${value}
      </div>
      <div class="entry-actions">
        <button class="edit-button" onclick="editEntry('${escapedKey}', '${escapedValue}')">Edit</button>
        <button class="delete-button" onclick="deleteEntry('${escapedKey}')">Delete</button>
      </div>
    `;
    storeContent.appendChild(entry);
  });
}

// Update store display whenever any record changes
room.onRecordChanged = renderStore;

// Function to update the store
async function updateStore() {
  const key = document.getElementById('keyInput').value;
  const value = document.getElementById('valueInput').value;
  
  if (!key) {
    alert('Please enter a key');
    return;
  }

  try {
    await room.store.update({
      id: key,
      dependencies: { value },
      updateFunction: () => value
    });

    // Clear inputs
    document.getElementById('keyInput').value = '';
    document.getElementById('valueInput').value = '';
  } catch (error) {
    console.error('Error updating store:', error);
    alert('Failed to update store');
  }
}

// Function to edit an entry
async function editEntry(key, currentValue) {
  try {
    const parsedValue = JSON.parse(currentValue);
    const newValue = prompt(`Edit value for "${key}":`, parsedValue);
    
    if (newValue !== null) {
      await room.store.update({
        id: key,
        dependencies: { newValue },
        updateFunction: () => newValue
      });
    }
  } catch (error) {
    console.error('Error editing entry:', error);
    alert('Failed to edit entry');
  }
}

// Function to delete an entry
async function deleteEntry(key) {
  if (confirm(`Are you sure you want to delete "${key}"?`)) {
    try {
      await room.store.update({
        id: key,
        dependencies: {},
        updateFunction: () => undefined // Setting to undefined removes the entry
      });
    } catch (error) {
      console.error('Error deleting entry:', error);
      alert('Failed to delete entry');
    }
  }
}

// Initial store content load
renderStore();
</script>
